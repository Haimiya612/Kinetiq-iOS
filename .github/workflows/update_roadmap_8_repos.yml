name: Kinetiq - Update Eight-Repository Roadmap

on:
  workflow_dispatch:
    inputs:
      commit_roadmap:
        description: "Commit docs/ROADMAP.md to main? Default false; download artifact first."
        required: true
        type: boolean
        default: false
  push:
    paths:
      - 'scripts/update_roadmap_8_repos.py'
      - 'docs/ROADMAP_8_REPOSITORY_2026-11-08.md'
      - '.github/workflows/update_roadmap_8_repos.yml'

permissions:
  contents: write

jobs:
  update-roadmap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test roadmap merge rules
        run: python3 -m unittest discover -s tests -p test_roadmap_merger.py -v

      - name: Generate revised roadmap (preserve existing phases)
        run: |
          python3 scripts/update_roadmap_8_repos.py --no-backup
          python3 scripts/update_roadmap_8_repos.py --check
          git diff --check
          grep -q 'Eight-Repository Integration Programme' docs/ROADMAP.md
          grep -q 'Batch 05O' docs/ROADMAP.md
          grep -q '# Phase 7 -- Manga & Image Reader' docs/ROADMAP.md

      - name: Upload complete updated roadmap
        uses: actions/upload-artifact@v4
        with:
          name: Kinetiq-8-Repo-Updated-Roadmap
          path: docs/ROADMAP.md
          if-no-files-found: error

      - name: Commit roadmap only on explicit request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_roadmap == true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md
          if git diff --cached --quiet; then
            echo "Roadmap already current"
          else
            git commit -m "docs: expand roadmap with eight-repository integration plan"
            git push
          fi
